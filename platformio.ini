; PlatformIO Project Configuration File
; Waveshare ESP32-S31-Zero Classic Bluetooth Internet Radio (ESP-IDF v6.1)

[platformio]
src_dir = main

[env:waveshare_esp32_s31_zero]
platform = file://${sysenv.HOME}/.platformio/platforms/espressif32-idf61
board = waveshare_esp32_s31_zero
framework = espidf
board_build.partitions = partitions.csv
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults
extra_scripts =
    post:tools/pio_factory_offset.py
monitor_speed = 115200
upload_speed = 460800
upload_flags =
    --no-stub
monitor_rts = 0
monitor_dtr = 0
monitor_filters =
    esp32_exception_decoder
